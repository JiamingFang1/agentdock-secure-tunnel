name: validate

on:
  push:
  pull_request:

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and launcher mode
        run: |
          bash -n agentdock scripts/bootstrap-tunnel.sh scripts/agentdock.sh
          test -x agentdock
      - name: Offline download and launcher regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/bootstrap-tunnel.ps1','scripts/windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
