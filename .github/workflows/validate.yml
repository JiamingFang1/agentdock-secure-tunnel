name: validate

on:
  push:
  pull_request:

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and launcher mode
        run: |
          bash -n agentdock scripts/bootstrap-tunnel.sh scripts/agentdock.sh
          test -x agentdock
      - name: Offline download and launcher regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Offline real CMD and Windows PowerShell entry regression tests
        shell: powershell
        run: python -m unittest discover -s tests -p 'test_windows_entry.py' -v
      - name: WSL detection regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/test-wsl-detection.ps1
      - name: WSL detection regression tests (PowerShell 7)
        shell: pwsh
        run: ./tests/test-wsl-detection.ps1
