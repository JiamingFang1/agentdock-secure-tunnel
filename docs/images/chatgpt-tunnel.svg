<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="920" height="520" fill="#f7f7f8"/><rect x="80" y="35" width="760" height="450" rx="18" fill="#fff" stroke="#d7d7d7"/><style>.h{font:700 25px system-ui;fill:#202124}.l{font:600 16px system-ui;fill:#333}.p{font:14px system-ui;fill:#666}.box{fill:#fff;stroke:#cfd3d8;stroke-width:1.5}.pill{fill:#111}.pt{font:600 14px system-ui;fill:#fff}.off{fill:#eceef1}</style><text class="h" x="120" y="85">ChatGPT → Settings → Connectors → New App</text><text class="l" x="120" y="140">Connection</text><rect class="off" x="270" y="115" width="250" height="42" rx="21"/><rect class="pill" x="395" y="119" width="121" height="34" rx="17"/><text class="pt" x="456" y="142" text-anchor="middle">Tunnel</text><text class="l" x="120" y="205">Available tunnels</text><rect class="box" x="270" y="178" width="470" height="50" rx="8"/><text class="p" x="292" y="209">Select the same Tunnel from Platform</text><text class="l" x="120" y="280">Authentication</text><rect class="box" x="270" y="253" width="470" height="50" rx="8"/><text class="p" x="292" y="284">No connector auth / None (when available)</text><text class="p" x="120" y="344">Do not paste the AgentDock local Bearer Token here.</text><text class="p" x="120" y="370">tunnel-client injects it only on the local hop to AgentDock.</text><rect class="pill" x="620" y="410" width="120" height="42" rx="8"/><text class="pt" x="680" y="437" text-anchor="middle">Save</text></svg>