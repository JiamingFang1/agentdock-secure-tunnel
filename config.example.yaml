# Copy this file to config.yaml and edit the values below.
# config.yaml is ignored by Git so your Runtime API Key is not committed.

# auto   = prefer Docker; if Docker is unavailable, ask before native install
# docker = require Docker isolation
# native = install AgentDock directly on the host (no container isolation)
deployment_mode: 'auto'

tunnel_id: 'TUNNEL_ID_HERE'
runtime_api_key: 'RUNTIME_API_KEY_HERE'
agentdock_port: 18765

# Workspace names are derived automatically from the final directory name.
# /home/user/project/VisionAgent -> VisionAgent
# D:\work\chatgpt-workspace      -> chatgpt-workspace
# default_workspace selects one of those derived names.
default_workspace: 'VisionAgent'

# Multiple host directories can be mounted into one AgentDock instance.
# mode: rw = read/write, ro = read-only
# Windows paths and WSL/Linux/macOS paths are supported.
workspaces:
  - path: '/home/user/project/VisionAgent'
    mode: 'rw'

  - path: 'D:\work\chatgpt-workspace'
    mode: 'rw'
